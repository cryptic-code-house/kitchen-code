<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A04C25"/>
      <stop offset="35%" stop-color="#D26E38"/>
      <stop offset="70%" stop-color="#BC5C2B"/>
      <stop offset="100%" stop-color="#7B3314"/>
    </linearGradient>
    <radialGradient id="cheeseMelt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="80%" stop-color="#FFC83B"/>
      <stop offset="100%" stop-color="#E28E00"/>
    </radialGradient>
  </defs>
  <!-- Earthenware Kulhad Cup -->
  <path d="M 22 30 L 32 86 C 33 90 67 90 68 86 L 78 30 Z" fill="url(#clayGrad)" stroke="#1C1512" stroke-width="2.5"/>
  <!-- Rim -->
  <ellipse cx="50" cy="30" rx="28" ry="8" fill="#BC5C2B" stroke="#1C1512" stroke-width="2.5"/>
  <!-- Bubbling cheese inside rim -->
  <ellipse cx="50" cy="30" rx="24" ry="6" fill="url(#cheeseMelt)"/>
  <!-- Cheese spill / drop over rim -->
  <path d="M 44 32 C 44 42 56 46 56 32 Z" fill="#FFC83B" stroke="#1C1512" stroke-width="1.5"/>
  <!-- Herb flakes on top -->
  <circle cx="45" cy="28" r="1.5" fill="#2E7D32"/>
  <circle cx="53" cy="31" r="1.5" fill="#D92525"/>
  <circle cx="58" cy="29" r="1.5" fill="#2E7D32"/>
  <!-- Terracotta texture ribs -->
  <path d="M 26 48 Q 50 54 74 48" stroke="#7B3314" stroke-width="1.5" fill="none"/>
  <path d="M 29 66 Q 50 72 71 66" stroke="#7B3314" stroke-width="1.5" fill="none"/>
</svg>
